# ═══════════════════════════════════════════════════════════════
#  BitFood — BTCPay Server Stack
#
#  Serviços:
#    bitcoind  — Bitcoin Core pruned (~9-12 GB disco total)
#    lnd       — Lightning Network Daemon
#    postgres  — banco de dados (BTCPay + NBXplorer)
#    nbxplorer — rastreia endereços Bitcoin para o BTCPay
#    btcpay    — BTCPay Server (UI + Greenfield API)
#
#  Acesso: https://btcpay.bitfood.app  (Cloudflare Tunnel → :8080)
#  Sync inicial do nó: 1-3 dias (só na primeira vez)
# ═══════════════════════════════════════════════════════════════

x-logging: &log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ── Bitcoin Core (pruned: mantém só 1 GB de blocos recentes) ──
  # UTXO set (~6-8 GB) é sempre guardado — não é afetado pelo prune.
  bitcoind:
    image: btcpayserver/bitcoin:31.0
    restart: unless-stopped
    logging: *log
    environment:
      BITCOIN_NETWORK: mainnet
      BITCOIN_EXTRA_ARGS: |-
        prune=4000
        maxmempool=300
        dbcache=2048
        server=1
        txindex=0
        rpcbind=0.0.0.0
        rpcallowip=0.0.0.0/0
        rpcuser=${BTC_RPC_USER}
        rpcpassword=${BTC_RPC_PASS}
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
        deprecatedrpc=startingheight
    volumes:
      - bitcoind_data:/data
    ports:
      - "8333:8333"   # Bitcoin P2P
      - "127.0.0.1:8332:8332"   # RPC (só loopback — p/ o monitor ler o progresso)

  # ── LND — Lightning Network Daemon ────────────────────────────
  # LND oficial — NÃO cria wallet sozinho (init manual via GUI; seed sob seu controle)
  lnd:
    image: lightninglabs/lnd:v0.18.5-beta
    restart: unless-stopped
    logging: *log
    command: ["--configfile=/root/.lnd/lnd.conf"]
    volumes:
      - lnd_data:/root/.lnd
      - ./lnd.conf:/root/.lnd/lnd.conf:ro
      - ./walletpw.txt:/root/.lnd/walletpw.txt:ro
    ports:
      - "9735:9735"   # Lightning P2P
      - "127.0.0.1:8081:8080"   # REST (só loopback — p/ o monitor)
    depends_on:
      - bitcoind

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NBXplorer — rastreia endereços Bitcoin ─────────────────────
  nbxplorer:
    image: nicolasdorier/nbxplorer:2.5.4
    restart: unless-stopped
    logging: *log
    environment:
      NBXPLORER_NETWORK: mainnet
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_CHAINS: btc
      NBXPLORER_BTCRPCURL: http://bitcoind:8332/
      NBXPLORER_BTCRPCUSER: ${BTC_RPC_USER}
      NBXPLORER_BTCRPCPASSWORD: ${BTC_RPC_PASS}
      NBXPLORER_BTCNODEENDPOINT: bitcoind:8333
      NBXPLORER_POSTGRES: "User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer"
      NBXPLORER_DBTRIE: 0
      # Sem cookie auth: NBXplorer não publica portas (só rede interna do Docker),
      # e BTCPay não compartilha o volume do cookie. Acesso restrito à rede Docker.
      NBXPLORER_NOAUTH: 1
    volumes:
      - nbxplorer_data:/datadir
    depends_on:
      postgres:
        condition: service_healthy
      bitcoind:
        condition: service_started

  # ── BTCPay Server ──────────────────────────────────────────────
  btcpay:
    image: btcpayserver/btcpayserver:2.0.2
    restart: unless-stopped
    logging: *log
    environment:
      BTCPAY_NETWORK: mainnet
      BTCPAY_ROOTPATH: /
      BTCPAY_BIND: 0.0.0.0:3000
      BTCPAY_POSTGRES: "User ID=postgres;Host=postgres;Port=5432;Database=btcpayserver"
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_EXTERNALURL: https://btcpay.bitfood.app
      # Conexão com LND via REST — lê macaroon direto do volume compartilhado
      BTCPAY_BTCLIGHTNING: "type=lnd-rest;server=https://lnd:8080;macaroonfilepath=/lnd/data/chain/bitcoin/mainnet/admin.macaroon;allowinsecure=true"
    ports:
      - "8080:3000"   # Cloudflare Tunnel: btcpay.bitfood.app → :8080
    volumes:
      - btcpay_data:/datadir
      - lnd_data:/lnd:ro   # somente leitura — acessa macaroons do LND
    depends_on:
      postgres:
        condition: service_healthy
      nbxplorer:
        condition: service_started
      lnd:
        condition: service_started

  # ── ThunderHub — GUI de gestão do nó (canais, rebalanceamento) ────
  thunderhub:
    image: apotdevin/thunderhub:0.18.4
    restart: unless-stopped
    logging: *log
    environment:
      ACCOUNT_CONFIG_PATH: /config/thubConfig.yaml
    volumes:
      - lnd_data:/lnd:ro
      - ./thubConfig.yaml:/config/thubConfig.yaml:ro
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - lnd

  # ── RTL (Ride The Lightning) — GUI de gestão + Circular Rebalance ──
  rtl:
    image: shahanafarooqui/rtl:v0.15.8
    restart: unless-stopped
    logging: *log
    environment:
      RTL_CONFIG_PATH: /RTL
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - lnd_data:/lnd:ro
      - ./RTL-Config.json:/RTL/RTL-Config.json
      - rtl_db:/RTL/database
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - lnd

volumes:
  bitcoind_data:
  lnd_data:
  postgres_data:
  nbxplorer_data:
  btcpay_data:
  rtl_db:
